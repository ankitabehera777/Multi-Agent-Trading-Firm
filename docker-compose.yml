version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: trading_mysql
    environment:
      # Docker automatically pulls these values from your .env file
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  chroma-db:
    image: chromadb/chroma:latest
    container_name: trading_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mysql_data:
  chroma_data: